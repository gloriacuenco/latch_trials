[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latch"
version = "0.0.1"
description = "LATCH: Latent Anatomy-preserving Transport for Cross-site Harmonization"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["hdev*"]
